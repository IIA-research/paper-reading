name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save new thumbnails back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so each note gets its last-updated date
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # A paper gets its Figure 1 and a first-page thumbnail once someone writes a note on it.
      - name: Thumbnails for newly noted papers
        run: python scripts/make_thumbs.py
      - name: Save new thumbnails to the repo
        run: |
          if [ -n "$(git status --porcelain thumbs figs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thumbs figs
            git commit -m "Add thumbnails for newly noted papers"
            git pull --rebase && git push || echo "Could not push thumbnails; the next run will redo them."
          fi

      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
